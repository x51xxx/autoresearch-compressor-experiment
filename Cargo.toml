[package]
name = "lz77-bench"
version = "0.1.0"
edition = "2021"
description = "LZ77 compressor evolved by an AI agent in an autoresearch loop"
license = "MIT"
repository = "https://github.com/x51xxx/autoresearch-compressor-experiment"
readme = "README.md"
publish = false

[dependencies]
flate2 = "1"
lz4_flex = "0.11"
brotli = "7"
zstd = "0.13"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
